version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.dev
    ports:
      - "5173:5173"
    restart: always
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "4000:4000"
    restart: always
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - PORT=4000
      - HOST=0.0.0.0
      - DB_HOST=postgres_db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=secretpassword
      - DB_NAME=KontenKreator
      # Jika menggunakan Prisma / TypeORM (DATABASE_URL):
      - DATABASE_URL=postgresql://postgres:secretpassword@postgres_db:5432/KontenKreator
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - JWT_SECRET=${JWT_SECRET}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY}
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - postgres_db

  postgres_db:
    image: postgres:16-alpine
    container_name: postgres_kontenkreator
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: owllfiewolfie
      POSTGRES_DB: secretpassword
    ports:
      - "5432:5432" # Opens port 5432 so Navicat from outside Docker can connect
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql # Automatically executes the tables the first time the container is created

volumes:
  pgdata:
